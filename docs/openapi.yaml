openapi: 3.0.3
info:
  title: NanoPay API
  version: "2.0.0"
  description: |
    API Backend NanoPay — commande centrale unique reliant Client, Commerçant, Banque et Admin,
    avec trois modes de financement : **Épargne**, **Coffre** (prélèvement sur salaire) et **Crédit**.

    Conforme au « Cahier de construction BACKEND ».

    ## Contrat de connexion
    | Élément | Contrat |
    |---|---|
    | Base URL | `/api` (alias historique `/api/v1`) |
    | Format | JSON UTF-8 (multipart pour les documents) |
    | Auth | `Authorization: Bearer <accessToken>` + refresh token (`/auth/refresh`, rotation) |
    | Succès | `{ "data": ..., "meta"?: ... }` |
    | Erreur | `{ "code", "message", "details"?, "requestId" }` (`X-Request-Id` aussi en en-tête) |
    | Pagination | query `page`, `limit` ; `meta` = `{ page, limit, total, nextPage }` |
    | Dates | ISO 8601 |
    | Montants | FCFA **entiers**, jamais de flottant |
    | Identifiants | UUID serveur ; `orderNumber` lisible (ex. `NP-2026-00001245`) pour l'UI |
    | Temps réel | pas de WebSocket : polling contrôlé de `GET /notifications` et des ressources |

    Les règles financières et de sécurité sont **toujours** appliquées côté backend ; le frontend
    ne fait que consommer ces contrats.

    ## Circuit
    Client → produit → commande (`CREEE`) → `select-financing` (`FINANCEMENT_EN_COURS`) →
    Épargne / Coffre / Crédit → `FINANCEE` → `PRETE_A_LIVRER` (+ QR) → scan commerçant →
    retrait confirmé (`LIVREE`, règlement commerçant déclenché) → règlement payé (`TERMINEE`).
servers:
  - url: http://localhost:4000/api
    description: Développement local
tags:
  - { name: Auth, description: Inscription, connexion, profil }
  - { name: Marketplace, description: Villes, communes, boutiques, produits (public) }
  - { name: Orders, description: Commandes et choix du financement (CLIENT) }
  - { name: Savings, description: Épargne progressive (CLIENT) }
  - { name: Vault, description: Coffre — prélèvement automatique sur salaire (CLIENT) }
  - { name: Credit, description: Profil bancaire, demandes et crédits (CLIENT) }
  - { name: Merchant, description: Boutique, produits, commandes, QR, retrait (MERCHANT) }
  - { name: Bank, description: Profils, demandes de crédit, avis de virement (BANK) }
  - { name: Admin, description: Supervision, paramètres, règlements (ADMIN) }
  - { name: Webhooks, description: Événements Mobile Money signés }
  - { name: Notifications, description: Notifications de l'acteur connecté }
  - { name: Documents, description: Documents privés (CNIB, bulletins) à accès contrôlé }
security:
  - bearerAuth: []
paths:
  # ------------------------------------------------------------------ AUTH
  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription Client ou Commerçant
      description: |
        Public. `multipart/form-data` avec les photos `cnibRecto` et `cnibVerso` (stockées de façon privée).
        `role=CLIENT` : compte `ACTIF` immédiatement. `role=MERCHANT` : `EN_ATTENTE` jusqu'à validation Admin.
        Les rôles BANK et ADMIN ne s'inscrivent pas (provisionnés hors API, voir `npm run seed:demo`).
        Les chemins `/auth/register/client` et `/auth/register/merchant` sont des alias.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [role, email, password, firstName, lastName, cnibRecto, cnibVerso]
              properties:
                role: { type: string, enum: [CLIENT, MERCHANT] }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                firstName: { type: string }
                lastName: { type: string }
                phoneNumber: { type: string, description: "CLIENT" }
                cityId: { type: string, description: "CLIENT" }
                communeId: { type: string, description: "CLIENT" }
                ifuRccmNumber: { type: string, description: "MERCHANT" }
                orangeMoneyNumber: { type: string, description: "MERCHANT" }
                corisMoneyNumber: { type: string, description: "MERCHANT" }
                defaultPayoutChannel: { type: string, enum: [ORANGE_MONEY, CORIS_MONEY], description: "MERCHANT" }
                cnibRecto: { type: string, format: binary }
                cnibVerso: { type: string, format: binary }
      responses:
        "201": { description: Compte créé, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: "`data` = { accessToken, refreshToken, user }", content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouvelle les jetons (rotation du refresh token)
      security: []
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "200": { description: "`data` = { accessToken, refreshToken }" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Révoque le refresh token (idempotent)
      security: []
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "204": { description: Déconnecté }
  /auth/recovery:
    post:
      tags: [Auth]
      summary: Récupération de compte (mot de passe temporaire par e-mail)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        "200": { description: Réponse identique que le compte existe ou non }
  /me:
    get:
      tags: [Auth]
      summary: Profil de l'utilisateur connecté (tous rôles)
      responses:
        "200": { description: "`data` = compte + profil client/commerçant/banque (sans les CNIB)" }
    patch:
      tags: [Auth]
      summary: Met à jour son profil / change son mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                phoneNumber: { type: string }
                cityId: { type: string }
                communeId: { type: string }
                orangeMoneyNumber: { type: string }
                corisMoneyNumber: { type: string }
                defaultPayoutChannel: { type: string, enum: [ORANGE_MONEY, CORIS_MONEY] }
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: Profil mis à jour }
  # ------------------------------------------------------------------ MARKETPLACE
  /marketplace/cities:
    get:
      tags: [Marketplace]
      summary: Liste des villes
      security: []
      responses:
        "200": { description: "`data` = [{ id, name }]" }
  /marketplace/communes:
    get:
      tags: [Marketplace]
      summary: Communes d'une ville
      security: []
      parameters:
        - { name: cityId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "`data` = [{ id, cityId, name }]" }
  /stores:
    get:
      tags: [Marketplace]
      summary: Boutiques (commerçants validés uniquement)
      security: []
      parameters:
        - { name: cityId, in: query, schema: { type: string } }
        - { name: communeId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Page de boutiques }
  /stores/{storeId}:
    get:
      tags: [Marketplace]
      summary: Détail d'une boutique et de ses produits publiés en stock
      security: []
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Boutique }
        "404": { $ref: "#/components/responses/Error" }
  /products/{productId}:
    get:
      tags: [Marketplace]
      summary: Détail d'un produit (prix FCFA entier, définitif une fois publié)
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Produit }
        "404": { $ref: "#/components/responses/Error" }
  # ------------------------------------------------------------------ ORDERS
  /orders:
    post:
      tags: [Orders]
      summary: Crée la commande d'un produit (CLIENT)
      description: Réserve une unité de stock. Le prix vient toujours de la base. Statut initial `CREEE`.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [productId], properties: { productId: { type: string } } } } }
      responses:
        "201": { description: Commande créée avec `orderNumber` }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Produit épuisé, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [Orders]
      summary: Mes commandes (CLIENT)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Page de commandes }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Détail d'une commande (propriétaire uniquement, sinon 404)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Commande avec épargne / coffre / demande de crédit / crédit }
        "404": { $ref: "#/components/responses/Error" }
  /orders/{id}/select-financing:
    post:
      tags: [Orders]
      summary: Choisit le mode de financement
      description: |
        `VAULT` et `CREDIT` exigent un profil crédit bancaire déjà `VALIDE` (Coffre : salarié uniquement).
        La commande passe à `FINANCEMENT_EN_COURS`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [SAVINGS, VAULT, CREDIT] } } } } }
      responses:
        "200": { description: Commande mise à jour }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}/qr:
    get:
      tags: [Orders]
      summary: Jeton QR serveur de la commande prête à livrer
      description: |
        `data` = `{ qrToken, expiresAt }`. Le QR ne contient que ce jeton opaque. Un jeton expiré est
        régénéré (l'ancien est invalidé). 403 tant que le financement n'est pas validé.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Jeton QR }
        "403": { $ref: "#/components/responses/Error" }
  # ------------------------------------------------------------------ SAVINGS
  /orders/{id}/savings:
    post:
      tags: [Savings]
      summary: Ouvre le plan d'épargne de la commande
      description: |
        Versement minimum / durée max selon le prix : ≤50 000 → 1 000 FCFA, 8 mois ; 50 000–100 000 → 2 000, 18 mois ;
        >100 000 → 5 000, 36 mois (paramétrable). La date de départ est celle du **premier versement validé**.
        `paymentReference` = `orderId` à fournir lors du versement Mobile Money.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { durationMonths: { type: integer, minimum: 1 } } } } }
      responses:
        "201": { description: Épargne créée }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /savings/{id}:
    get:
      tags: [Savings]
      summary: Détail (progression, reste, jours restants)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Épargne }
  /savings/{id}/history:
    get:
      tags: [Savings]
      summary: Historique des paiements de l'épargne
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Page de paiements }
  /savings/{id}/extension:
    post:
      tags: [Savings]
      summary: Prolonge l'échéance (2 mois maximum au total, avant l'échéance)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [months], properties: { months: { type: integer, minimum: 1, maximum: 2 } } } } }
      responses:
        "200": { description: Épargne en `PROLONGATION` }
        "400": { $ref: "#/components/responses/Error" }
  # ------------------------------------------------------------------ VAULT
  /orders/{id}/vault:
    post:
      tags: [Vault]
      summary: Programme le Coffre (prélèvement automatique sur salaire)
      description: "Réservé aux salariés dont le profil crédit est déjà validé. `multipart` : `durationMonths` + `salaryDebitAuthorization` (optionnel)."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [durationMonths]
              properties:
                durationMonths: { type: integer }
                salaryDebitAuthorization: { type: string, format: binary }
      responses:
        "201": { description: Coffre créé }
        "403": { $ref: "#/components/responses/Error" }
  /vaults/{id}:
    get:
      tags: [Vault]
      summary: Détail du Coffre
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Coffre }
  /vaults/{id}/use:
    post:
      tags: [Vault]
      summary: Utilise un Coffre complet (`OBJECTIF_ATTEINT`) → commande prête + QR
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: "`data` = { orderId, status, qrToken, expiresAt }" }
        "409": { $ref: "#/components/responses/Error" }
  /vaults/{id}/switch-to-credit:
    post:
      tags: [Vault]
      summary: Bascule vers un crédit pour le reste à financer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [durationMonths], properties: { durationMonths: { type: integer } } } } }
      responses:
        "201": { description: Demande de crédit créée, Coffre `BASCULE_VERS_CREDIT` }
        "403": { $ref: "#/components/responses/Error" }
  # ------------------------------------------------------------------ CREDIT
  /credit/profile:
    get:
      tags: [Credit]
      summary: Mon profil crédit (`NON_CONFIGURE` s'il n'existe pas)
      responses:
        "200": { description: Profil }
    post:
      tags: [Credit]
      summary: Soumet le profil crédit à la banque
      description: "`multipart` : `employer`, `registrationNumber?`, `bankAuthorization` (fichier), `paySlips` (fichier). Statut → `EN_ANALYSE`."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [employer, bankAuthorization, paySlips]
              properties:
                employer: { type: string }
                registrationNumber: { type: string }
                bankAuthorization: { type: string, format: binary }
                paySlips: { type: string, format: binary }
      responses:
        "201": { description: Profil soumis }
        "409": { $ref: "#/components/responses/Error" }
  /credit/requests:
    post:
      tags: [Credit]
      summary: Crée la demande de crédit d'une commande
      description: "Profil `VALIDE` requis. Durée validée par le backend (≤50 000 : 8 mois ; 50 000–100 000 : 12 ; au-delà +6 mois par tranche de 50 000). Montant à virer = prix + frais."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [orderId, durationMonths], properties: { orderId: { type: string }, durationMonths: { type: integer } } } } }
      responses:
        "201": { description: Demande `ENVOYEE` }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /credit/requests/{id}:
    get:
      tags: [Credit]
      summary: Détail d'une demande de crédit
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Demande }
  /credits/{id}:
    get:
      tags: [Credit]
      summary: Détail d'un crédit
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Crédit }
  # ------------------------------------------------------------------ MERCHANT
  /merchant/store:
    get: { tags: [Merchant], summary: Ma boutique, responses: { "200": { description: Boutique } } }
    post:
      tags: [Merchant]
      summary: Crée ma boutique (compte VALIDE requis)
      requestBody: { $ref: "#/components/requestBodies/Store" }
      responses: { "201": { description: Boutique créée }, "403": { $ref: "#/components/responses/Error" } }
    put:
      tags: [Merchant]
      summary: Met à jour ma boutique
      requestBody: { $ref: "#/components/requestBodies/Store" }
      responses: { "200": { description: Boutique mise à jour } }
  /merchant/products:
    post:
      tags: [Merchant]
      summary: Publie un produit
      description: "`price` : FCFA entier, **définitif** après publication."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, price, stock]
              properties:
                title: { type: string }
                description: { type: string }
                price: { type: integer, minimum: 1 }
                stock: { type: integer, minimum: 0 }
                isPublished: { type: boolean }
      responses: { "201": { description: Produit créé } }
  /merchant/products/{id}:
    patch:
      tags: [Merchant]
      summary: Modifie titre, description, stock ou publication
      description: Toute tentative de modifier `price` est refusée (422).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                stock: { type: integer, minimum: 0 }
                isPublished: { type: boolean }
      responses: { "200": { description: Produit mis à jour }, "422": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Merchant]
      summary: Supprime un produit (suppression logique)
      description: Refusée (409) tant qu'une commande non terminée le référence.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Supprimé }, "409": { $ref: "#/components/responses/Error" } }
  /merchant/products/{id}/media:
    post:
      tags: [Merchant]
      summary: Ajoute photos (`photos`, 10 max) et spots publicitaires (`spots`, 5 max)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos: { type: array, items: { type: string, format: binary } }
                spots: { type: array, items: { type: string, format: binary } }
      responses: { "201": { description: Médias ajoutés } }
  /merchant/orders:
    get:
      tags: [Merchant]
      summary: Commandes de ma boutique
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de commandes } }
  /merchant/settlements:
    get:
      tags: [Merchant]
      summary: Mes règlements
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Page de règlements } }
  /merchant/qr/scan:
    post:
      tags: [Merchant]
      summary: Valide un QR côté serveur (aucun changement d'état)
      description: |
        404 jeton inconnu ou d'une autre boutique (indistinguables) ; 409 déjà utilisé ou commande non prête ;
        410 `QR_EXPIRED`.
      requestBody: { $ref: "#/components/requestBodies/QrToken" }
      responses:
        "200": { description: "`data` = { orderId, orderNumber, product, amount, financingMode, client, qrExpiresAt }" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /merchant/orders/{id}/withdrawal-confirm:
    post:
      tags: [Merchant]
      summary: Confirme le retrait en boutique
      description: Consomme le jeton (atomique), commande → `LIVREE`, règlement commerçant créé (`EN_ATTENTE`) — paiement commerçant déclenché après retrait confirmé.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/QrToken" }
      responses:
        "200": { description: Retrait confirmé }
        "409": { $ref: "#/components/responses/Error" }
  # ------------------------------------------------------------------ BANK
  /bank/credit-profiles:
    get:
      tags: [Bank]
      summary: Profils crédit assignés (par défaut `EN_ANALYSE`)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [NON_CONFIGURE, EN_ANALYSE, VALIDE, REFUSE] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de profils } }
  /bank/credit-profiles/{id}/decision:
    patch:
      tags: [Bank]
      summary: Valide ou refuse un profil
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [VALIDE, REFUSE] }, reason: { type: string } } } } }
      responses: { "200": { description: Décision enregistrée }, "409": { $ref: "#/components/responses/Error" } }
  /bank/credit-requests:
    get:
      tags: [Bank]
      summary: Demandes de crédit assignées (par défaut `ENVOYEE` + `EN_ANALYSE`)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [BROUILLON, ENVOYEE, EN_ANALYSE, ACCEPTEE, REFUSEE] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de demandes } }
  /bank/credit-requests/{id}/decision:
    patch:
      tags: [Bank]
      summary: Accepte ou refuse une demande
      description: "`ACCEPTEE` crée le Crédit `EN_ATTENTE_DE_VIREMENT`. `REFUSEE` remet la commande à `CREEE`."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [ACCEPTEE, REFUSEE] }, reason: { type: string } } } } }
      responses: { "200": { description: Décision enregistrée }, "409": { $ref: "#/components/responses/Error" } }
  /bank/transfers/notice:
    post:
      tags: [Bank]
      summary: Avis de virement banque → NanoPay
      description: |
        `amount` doit égaler exactement le montant à virer (prix + frais), sinon 422. `transferReference` est UNIQUE :
        un même virement n'est jamais comptabilisé deux fois. Crédit `FINANCE`, commande `FINANCEE` → `PRETE_A_LIVRER` + QR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditId, transferReference, amount]
              properties:
                creditId: { type: string }
                transferReference: { type: string }
                amount: { type: integer }
      responses: { "201": { description: Virement enregistré }, "422": { $ref: "#/components/responses/Error" } }
  # ------------------------------------------------------------------ ADMIN
  /admin/dashboard:
    get: { tags: [Admin], summary: Indicateurs globaux, responses: { "200": { description: Tableau de bord } } }
  /admin/clients:
    get:
      tags: [Admin]
      summary: Clients
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIF, SUSPENDU] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de clients } }
  /admin/clients/{id}/status:
    patch:
      tags: [Admin]
      summary: Suspend / réactive un client
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ACTIF, SUSPENDU] }, reason: { type: string } } } } }
      responses: { "200": { description: Client mis à jour } }
  /admin/merchants:
    get:
      tags: [Admin]
      summary: Commerçants
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [EN_ATTENTE, VALIDE, SUSPENDU] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de commerçants } }
  /admin/merchants/{id}/status:
    patch:
      tags: [Admin]
      summary: Valide / suspend un commerçant
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [VALIDE, SUSPENDU] }, reason: { type: string } } } } }
      responses: { "200": { description: Commerçant mis à jour } }
  /admin/savings:
    get:
      tags: [Admin]
      summary: Épargnes
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Page d'épargnes } }
  /admin/savings/{id}/refund:
    post:
      tags: [Admin]
      summary: Marque le remboursement (85 %) d'une épargne `ECHOUEE` comme versé → `REMBOURSEE`
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reference: { type: string } } } } }
      responses: { "200": { description: Remboursée }, "409": { $ref: "#/components/responses/Error" } }
  /admin/credits:
    get:
      tags: [Admin]
      summary: Crédits
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Page de crédits } }
  /admin/payments:
    get:
      tags: [Admin]
      summary: Paiements
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [INITIE, EN_ATTENTE, CONFIRME, ECHOUE] } }
        - { name: orderId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de paiements } }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Journal d'audit (date, heure, identifiant, acteur, montant, statut)
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page d'entrées d'audit } }
  /admin/settlements:
    get:
      tags: [Admin]
      summary: Règlements commerçants
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [EN_ATTENTE, PAYE] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de règlements } }
  /admin/settlements/{id}/paid:
    post:
      tags: [Admin]
      summary: Confirme le versement du règlement → commande `TERMINEE`, crédit `TERMINE`
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reference], properties: { reference: { type: string } } } } }
      responses: { "200": { description: Réglé }, "409": { $ref: "#/components/responses/Error" } }
  /admin/settings/financial:
    get: { tags: [Admin], summary: Paramètres financiers effectifs, responses: { "200": { description: Paramètres } } }
    patch:
      tags: [Admin]
      summary: Modifie les paramètres financiers (pénalité, commissions, paliers, durées, TTL du QR…)
      description: Corps partiel ; toute clé inconnue est refusée (422). Tracé dans l'audit.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FinancialParams" } } }
      responses: { "200": { description: Paramètres mis à jour } }
  # ------------------------------------------------------------------ WEBHOOKS
  /webhooks/payment:
    post:
      tags: [Webhooks]
      summary: Événement de paiement Mobile Money / infrastructure interopérable
      description: |
        Public mais **signé** : `X-Signature` = HMAC-SHA256 hexadécimal du **corps brut** avec `PAYMENT_WEBHOOK_SECRET`.
        Signature, montant, commande, devise (`XOF`) et statut sont vérifiés avant toute écriture métier.
        `providerTransactionId` est UNIQUE : un même événement n'est jamais comptabilisé deux fois (rejeu → `duplicate: true`).
        `PENDING` puis `SUCCESS` pour la même transaction est géré. Un événement métier invalide est enregistré
        (`result: REJECTED`, avec `reason`) et renvoyé en 200 pour éviter un rejeu infini.
        Le versement est rattaché à l'épargne ou au Coffre de `orderId`.
      security: []
      parameters:
        - { name: X-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerTransactionId, orderId, amount, currency, status, timestamp]
              properties:
                providerTransactionId: { type: string }
                orderId: { type: string }
                amount: { type: integer, minimum: 1 }
                currency: { type: string, example: XOF }
                status: { type: string, enum: [SUCCESS, FAILED, PENDING] }
                payerReference: { type: string }
                timestamp: { type: string, format: date-time }
                provider: { type: string }
      responses:
        "200": { description: "`data` = { received, duplicate, result: APPLIED|IGNORED|REJECTED, reason? }" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  # ------------------------------------------------------------------ NOTIFICATIONS / DOCUMENTS
  /notifications:
    get:
      tags: [Notifications]
      summary: Mes notifications (polling)
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page de notifications } }
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marque une notification comme lue
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Lue }, "404": { $ref: "#/components/responses/Error" } }
  /documents/{filename}:
    get:
      tags: [Documents]
      summary: Document privé (propriétaire, Admin, ou Banque assignée)
      parameters: [{ name: filename, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Fichier }, "403": { $ref: "#/components/responses/Error" } }
  /documents/{filename}/temporary-url:
    post:
      tags: [Documents]
      summary: Crée une URL temporaire (5 min) vers un document privé
      parameters: [{ name: filename, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "`data` = { url, expiresAt }" } }
  /documents/temp/{token}:
    get:
      tags: [Documents]
      summary: Accès via URL temporaire signée (sans en-tête Authorization)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Fichier }, "401": { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  requestBodies:
    RefreshToken:
      required: true
      content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
    QrToken:
      required: true
      content: { application/json: { schema: { type: object, required: [qrToken], properties: { qrToken: { type: string } } } } }
    Store:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, cityId, communeId]
            properties:
              name: { type: string }
              cityId: { type: string }
              communeId: { type: string }
              addressDescription: { type: string }
  responses:
    Error:
      description: "Erreur — `{ code, message, details?, requestId }`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            nextPage: { type: integer, nullable: true }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details: {}
        requestId: { type: string }
    OrderStatus:
      type: string
      enum: [CREEE, FINANCEMENT_EN_COURS, FINANCEE, PRETE_A_LIVRER, LIVREE, TERMINEE]
    FinancialParams:
      type: object
      properties:
        savingsTiers:
          type: array
          items:
            type: object
            properties:
              maxAmount: { type: integer, nullable: true }
              minInstallment: { type: integer }
              maxDurationMonths: { type: integer }
        savingsExtensionMaxMonths: { type: integer }
        savingsPenaltyRate: { type: number, example: 0.15 }
        savingsCommissionRates:
          type: object
          properties: { tier1: { type: number }, tier2: { type: number }, tier3: { type: number } }
        creditTier1MaxMonths: { type: integer }
        creditTier2MaxMonths: { type: integer }
        creditExtraMonthsPerBracket: { type: integer }
        creditBracketSize: { type: integer }
        creditBankFeeRate: { type: number, example: 0.02 }
        creditMerchantCommissionRate: { type: number, example: 0.04 }
        qrTtlHours: { type: integer, example: 72 }
